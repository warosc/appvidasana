version: "3.9"

services:
  # ── Base de datos PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: frutinve-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: freshflow
      POSTGRES_PASSWORD: freshflow
      POSTGRES_DB: freshflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshflow -d freshflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend NestJS ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: frutinve-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgres://freshflow:freshflow@db:5432/freshflow
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-R00tp4ss123!}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
